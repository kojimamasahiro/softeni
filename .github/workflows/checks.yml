# データ健全性チェックの自動実行。
#
# なぜ要るか（docs/raw/2026-09-06-idea-autonomous-improvement-agent.md）:
# Cloudflare Pages が push ごとに `prebuild` を回すので「走る場所」自体は既にあるが、
# prebuild に置けるのは**ビルドを止めてよいゲートだけ**。
# そのため検出器11本のうち7本＋テスト系10本が置き場を失って休眠していた。
# 実際に2026-09-06 に休眠中の `verify-bracket-layout` を回したところ、
# 2026-09-04 に取り込んだデータで250件の不一致が2日間気付かれずに残っていた。
#
# ここは prebuild と役割を分ける:
#   - ゲート（gates）      … 落ちたら赤にする。デプロイは止めない（CF Pages とは独立）
#   - 報告（report-only）  … 人の判断待ちを一覧する。常に成功扱いでサマリに出す
#
# 「キュー型」の検出器（identity-health / upcoming-tournaments）は設計上いつも
# 未処理項目を返すためゲートにできない。これが休眠の構造的な原因だった。

name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜 09:00 JST（= 00:00 UTC）。push が無くても日付依存の項目を見るため。
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - run: pip install -r scripts/requirements-test.txt

      # ---- ゲート: 落ちたらこの workflow を赤にする ----
      - name: 孤立エントリー（どの試合にも現れない組）
        run: node scripts/check-orphan-entries.mjs

      - name: 最終成績の二重計上
        run: node scripts/check-duplicate-placements.mjs

      - name: growth analysis の fixture
        run: node scripts/check-growth-analysis.mjs

      - name: bracket のレイアウト・描画テスト
        run: npm run -s bracket:test

      - name: analytics テスト
        run: npm run -s analytics:test

      - name: upcoming テスト
        run: npm run -s upcoming:test

      - name: トップページのよく見られているページ テスト
        run: npm run -s popular:test

      - name: 選手ページの所属歴メタデータ テスト
        run: npm run -s career:test

      - name: 地域移行トラッカーの検証
        run: npm run -s club:verify

      # 2026-09-06 にレビュー結果をコミットして候補とマスタが整合したのでゲートへ昇格。
      # （それまでは1,211件ずれていたため報告のみに置いていた）
      - name: マージ候補とチームマスタのID照合
        run: node scripts/check-team-id-alignment.mjs

      # 2026-09-12 追加。機械だけで決めた統合49件から20件を人が点検したところ誤統合が11件（55%）で、
      # 原因は「名前より出場大会のジャンルを優先していた」こと。人の判断をそのまま固定してある。
      - name: チーム名寄せの既定グループ分け
        run: node scripts/lib/team-grouping.test.mjs

      # fixtures の PDF は .gitignore（`*.pdf`）で追跡していないので、CI では
      # PDF に依る項目が自動 SKIP される。カバーできるのは 144 項目中 75（52%）。
      # 残りを CI で見たければ fixtures の扱いを決める必要がある。
      - name: PDF→エントリー抽出の回帰テスト
        run: python3 test_regression.py
        working-directory: scripts/pdf-to-players

      - name: 会場データ検査の回帰テスト
        run: python3 test_regression.py
        working-directory: scripts/venue-agent

      - name: ブラケット復元の照合
        run: node scripts/verify-bracket-layout.mjs

      # 2026-09-19 追加。docs 全体のリンク切れ（ファイル・見出しアンカー）を見る。
      # 昨日の wiki 圧縮で見出しを変えた結果 ADR-005 からの参照が1件壊れており、
      # 手で叩くまで誰も気づけなかった。誰が見ても直すべき種類なのでゲートに置く。
      # 文字数の超過は下の「報告のみ」側（仕様が増えればページは育つので止めない）。
      - name: docs のリンク切れ
        run: npm run -s check:wiki -- --strict > /dev/null

      # 2026-09-22 追加。Codex 用の .agents/skills は .claude/skills へのリンク。
      # skill を足したのにリンクを張り忘れると Codex からだけ見えなくなる。
      - name: Codex 用 skill リンクの同期
        run: npm run -s sync:skills -- --check

      # ---- 報告のみ: 落ちてもこの workflow は赤にしない ----
      - name: 識別・名寄せの要対応（報告のみ）
        if: always()
        run: |
          {
            echo '## 識別・名寄せの要対応シグナル'
            echo '```'
            node scripts/check-identity-health.mjs 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: docs の文字数（報告のみ）
        if: always()
        run: |
          {
            echo '## docs の文字数（予算 12,000 字/ページ）'
            echo '```'
            npm run -s check:wiki 2>&1 | sed -n '/^# docs の文字数/,/^予算超過は全体で/p' | grep -E '^(##|超過|予算超過)' || true
            echo '```'
            echo '超過が続くなら docs/prompts/slim-wiki-page.md の手順で圧縮する。'
            echo ''
            echo '### docs 規約（適用範囲・孤立・ADR Status・Compile Log）'
            echo '```'
            npm run -s check:wiki 2>&1 | sed -n '/^# 規約チェック/,$p' | grep -E '^- ' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 大会情報の残タスク（報告のみ）
        if: always()
        run: |
          {
            echo '## 大会情報の残タスク'
            echo '```'
            node scripts/check-upcoming-tournaments.mjs 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
