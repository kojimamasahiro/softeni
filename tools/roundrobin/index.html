<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ラウンドロビン試合管理（グループ対応）</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>ラウンドロビン試合管理（グループ対応）</h1>
    <div id="matches"></div>
    <button onclick="onClickGenerate()">出力</button>
    <h2>JSON出力（成形済み）</h2>
    <p style="font-size: 12px; color: #555; margin: 4px 0">
      下のJSONは直接編集できます。編集するとスコア入力では上書きされなくなり、編集内容がそのままコピー／ダウンロード／保存に使われます。試合結果から作り直したい場合は
      <button type="button" onclick="onClickRegenerateJson()">
        試合結果から再生成
      </button>
      を押してください。
      <span id="jsonEditStatus" style="margin-left: 8px"></span>
    </p>
    <div id="validationResult"></div>
    <div id="saveUi"></div>
    <textarea id="jsonOutput"></textarea>

    <h2>トーナメントへ進出</h2>
    <div style="margin: 8px 0">
      <label>
        各グループ上位
        <input
          type="number"
          id="advanceRank"
          value="1"
          min="1"
          style="width: 50px"
        />
        位を進出:
      </label>
      <button onclick="onClickExtractAdvancers()">進出ペアを抽出</button>
      <button onclick="onClickGoTournament()">トーナメント画面へ</button>
      <span id="advanceStatus" style="font-size: 12px; color: #c62828"></span>
    </div>
    <p style="font-size: 12px; color: #555; margin: 4px 0">
      抽出結果は下で編集できます（並び順がそのまま組み合わせ順になります）。
    </p>
    <textarea id="advancersJson" style="height: 160px"></textarea>

    <!-- キーボードショートカットヘルプボタン -->
    <button
      class="keyboard-help-button"
      onclick="toggleHelp()"
      title="キーボードショートカット (?)"
    >
      ?
    </button>

    <script src="initialPlayer.js"></script>
    <script src="../shared/knockout-draw.js"></script>
    <script src="../shared/normalize-core.js"></script>
    <script src="../shared/validate-entries.js"></script>
    <script src="../shared/tool-bridge.js"></script>
    <script>
      const initScore = 4; // 初期スコア

      // ハブページからの入力があれば initialPlayer.js より優先
      const playersByGroup =
        ToolBridge.loadInput('roundrobin') ||
        (typeof initialPlayersByGroup !== 'undefined'
          ? initialPlayersByGroup
          : {});

      const byePlayer = { id: 'bye', name: 'パッキン', information: [] };
      const allGroupMatches = {};

      for (const group in playersByGroup) {
        const players = playersByGroup[group];
        const matches = [];
        for (let i = 0; i < players.length; i++) {
          for (let j = i + 1; j < players.length; j++) {
            const p1 = players[i];
            const p2 = players[j];
            if (p1.id === 'bye' || p2.id === 'bye') continue;
            matches.push({
              group,
              p1,
              p2,
              scores: { p1: initScore, p2: initScore },
              winner: null,
            });
          }
        }
        allGroupMatches[group] = matches;
      }

      // ---- JSON出力の手動編集対応 ----
      let jsonManuallyEdited = false;

      function setJsonEditStatus() {
        const statusEl = document.getElementById('jsonEditStatus');
        if (!statusEl) return;
        if (!jsonManuallyEdited) {
          statusEl.textContent = '';
          return;
        }
        const value = document.getElementById('jsonOutput').value;
        let valid = true;
        try {
          JSON.parse(value);
        } catch (e) {
          valid = false;
        }
        if (valid) {
          statusEl.textContent = '手動編集中（JSON OK）';
          statusEl.style.color = '#2e7d32';
        } else {
          statusEl.textContent = '手動編集中（JSONが不正です）';
          statusEl.style.color = '#c62828';
        }
      }

      function onClickGenerate() {
        // 手動編集を尊重しつつ、未編集なら通常通り生成する
        updateJsonOutput();
      }

      // 試合結果から作り直す（手動編集を破棄）
      function onClickRegenerateJson() {
        if (
          jsonManuallyEdited &&
          !confirm('手動編集した内容を破棄して試合結果から再生成しますか？')
        ) {
          return;
        }
        jsonManuallyEdited = false;
        updateJsonOutput(true);
        setJsonEditStatus();
      }

      function updateWinner(match) {
        if (match.scores.p1 != null && match.scores.p2 != null) {
          if (match.scores.p1 > match.scores.p2) match.winner = match.p1.id;
          else if (match.scores.p2 > match.scores.p1)
            match.winner = match.p2.id;
          else match.winner = null;
        }
      }

      // ---- 追加/変更：名前生成・カテゴリ判定 ----
      function buildPairName(information) {
        const names = information.map(
          ({ lastName, firstName }) => `${lastName} ${firstName}`,
        );
        const teams = [
          ...new Set(information.map(({ team }) => team).filter(Boolean)),
        ];
        if (teams.length === 1) return `${names.join('・')}（${teams[0]}）`;
        return information
          .map(
            ({ lastName, firstName, team }) =>
              `${lastName} ${firstName}（${team}）`,
          )
          .join('・');
      }

      function getDisplayName(entry) {
        let baseName = '';
        if (Array.isArray(entry.information) && entry.information.length) {
          baseName = buildPairName(entry.information); // doubles等
        } else {
          baseName = entry.name || String(entry.id); // team等
        }
        // idが存在し、byeでなければ先頭に付与
        if (entry.id && entry.id !== 'bye') {
          return `${entry.id}. ${baseName}`;
        }
        return baseName;
      }

      function detectCategory(entry) {
        if (entry.category) return entry.category; // 明示があれば最優先
        if (Array.isArray(entry.information) && entry.information.length)
          return 'doubles';
        if (entry.team) return 'team';
        return 'unknown';
      }

      // 試合結果に依存しないエントリー一覧（開催前でもJSONを取得できるようにする）。
      // playersByGroup（グループ分けされた入力）から直接組み立てるので、
      // 1試合もスコア入力していない状態でも participants / entries が出力される。
      // tournament3/index.html の buildEntriesMeta() と役割は同じ。
      function buildEntriesMeta() {
        const rows = [];
        for (const group in playersByGroup) {
          const players = playersByGroup[group] || [];
          for (const p of players) {
            if (!p || p.id == null || p.id === 'bye') continue;
            const row = { entryNo: p.id, type: null };
            if (detectCategory(p) === 'team') {
              row.team = p.team || p.name;
              if (p.prefecture) row.prefecture = p.prefecture;
            } else {
              const info = Array.isArray(p.information) ? p.information : [];
              const playerIds = info
                .map((i) => i.tempId)
                .filter((id) => id != null);
              if (playerIds.length) row.playerIds = playerIds;
              const players2 = info.map((i) => ({
                tempId: i.tempId ?? null,
                lastName: i.lastName ?? null,
                firstName: i.firstName ?? null,
                team: i.team ?? null,
                prefecture: i.prefecture ?? null,
              }));
              if (players2.length) row.players = players2;
            }
            rows.push(row);
          }
        }
        rows.sort((a, b) => (Number(a.entryNo) || 0) - (Number(b.entryNo) || 0));
        return rows;
      }
      // ---------------------------------------

      // ========================================
      // キーボードショートカット: フォーカス管理
      // ========================================
      let currentFocus = {
        group: null,
        index: 0,
        player: 'p1', // 'p1' or 'p2'
      };
      let isHelpVisible = false;

      function getGroupKeys() {
        return Object.keys(allGroupMatches);
      }

      function getMatchesForGroup(group) {
        return allGroupMatches[group] || [];
      }

      // dir方向に、試合が1件以上あるグループのインデックスを探す（無ければ-1）
      function findNonEmptyGroupIndex(groups, fromIdx, dir) {
        let idx = fromIdx;
        while (idx >= 0 && idx < groups.length) {
          if (getMatchesForGroup(groups[idx]).length > 0) return idx;
          idx += dir;
        }
        return -1;
      }

      function initFocus() {
        const groups = getGroupKeys();
        const idx = findNonEmptyGroupIndex(groups, 0, 1);
        if (idx >= 0) {
          currentFocus.group = groups[idx];
          currentFocus.index = 0;
          currentFocus.player = 'p1';
        }
      }

      // フォーカスを視覚的に表示
      function applyFocusVisuals() {
        document.querySelectorAll('.match-result.focused').forEach((el) => {
          el.classList.remove('focused');
        });
        document
          .querySelectorAll('.player-score-row.focused')
          .forEach((el) => {
            el.classList.remove('focused');
          });

        if (currentFocus.group == null) return;
        const card = document.querySelector(
          `.match-result[data-match="${currentFocus.group}-${currentFocus.index}"]`,
        );
        if (card) {
          card.classList.add('focused');
          const row = card.querySelector(
            `.player-score-row[data-player="${currentFocus.player}"]`,
          );
          if (row) row.classList.add('focused');
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }

      function moveFocusTo(group, index, player) {
        const matches = getMatchesForGroup(group);
        if (index < 0 || index >= matches.length) return false;
        currentFocus.group = group;
        currentFocus.index = index;
        currentFocus.player = player || 'p1';
        applyFocusVisuals();
        return true;
      }

      // 次の試合へ（グループ末尾なら次のグループの先頭、末端なら先頭へ循環）
      function focusNextMatch() {
        if (currentFocus.group == null) return;
        const groups = getGroupKeys();
        const gIdx = groups.indexOf(currentFocus.group);
        const matches = getMatchesForGroup(currentFocus.group);
        const nextIndex = currentFocus.index + 1;

        if (nextIndex < matches.length) {
          currentFocus.index = nextIndex;
          currentFocus.player = 'p1';
          applyFocusVisuals();
          return;
        }

        const nextG = findNonEmptyGroupIndex(groups, gIdx + 1, 1);
        const wrapG =
          nextG >= 0 ? nextG : findNonEmptyGroupIndex(groups, 0, 1);
        if (wrapG >= 0) {
          currentFocus.group = groups[wrapG];
          currentFocus.index = 0;
          currentFocus.player = 'p1';
        }
        applyFocusVisuals();
      }

      // 前の試合へ（グループ先頭なら前のグループの末尾、先端なら末尾へ循環）
      function focusPrevMatch() {
        if (currentFocus.group == null) return;
        const groups = getGroupKeys();
        const gIdx = groups.indexOf(currentFocus.group);
        const prevIndex = currentFocus.index - 1;

        if (prevIndex >= 0) {
          currentFocus.index = prevIndex;
          currentFocus.player = 'p2';
          applyFocusVisuals();
          return;
        }

        const prevG = findNonEmptyGroupIndex(groups, gIdx - 1, -1);
        const wrapG =
          prevG >= 0
            ? prevG
            : findNonEmptyGroupIndex(groups, groups.length - 1, -1);
        if (wrapG >= 0) {
          const matches = getMatchesForGroup(groups[wrapG]);
          currentFocus.group = groups[wrapG];
          currentFocus.index = matches.length - 1;
          currentFocus.player = 'p2';
        }
        applyFocusVisuals();
      }

      // 次の選手にフォーカス（Tab）
      function focusNextPlayer() {
        if (currentFocus.player === 'p1') {
          currentFocus.player = 'p2';
          applyFocusVisuals();
        } else {
          focusNextMatch();
        }
      }

      // 前の選手にフォーカス（Shift+Tab）
      function focusPrevPlayer() {
        if (currentFocus.player === 'p2') {
          currentFocus.player = 'p1';
          applyFocusVisuals();
        } else {
          focusPrevMatch();
        }
      }

      function focusMatchUp() {
        if (currentFocus.group == null) return;
        moveFocusTo(
          currentFocus.group,
          currentFocus.index - 1,
          currentFocus.player,
        );
      }

      function focusMatchDown() {
        if (currentFocus.group == null) return;
        moveFocusTo(
          currentFocus.group,
          currentFocus.index + 1,
          currentFocus.player,
        );
      }

      function focusPlayerLeft() {
        currentFocus.player = 'p1';
        applyFocusVisuals();
      }

      function focusPlayerRight() {
        currentFocus.player = 'p2';
        applyFocusVisuals();
      }

      function focusGroupPrev() {
        const groups = getGroupKeys();
        const gIdx = groups.indexOf(currentFocus.group);
        const prevG = findNonEmptyGroupIndex(groups, gIdx - 1, -1);
        if (prevG >= 0) moveFocusTo(groups[prevG], 0, 'p1');
      }

      function focusGroupNext() {
        const groups = getGroupKeys();
        const gIdx = groups.indexOf(currentFocus.group);
        const nextG = findNonEmptyGroupIndex(groups, gIdx + 1, 1);
        if (nextG >= 0) moveFocusTo(groups[nextG], 0, 'p1');
      }

      function focusFirstMatch() {
        const groups = getGroupKeys();
        const idx = findNonEmptyGroupIndex(groups, 0, 1);
        if (idx >= 0) moveFocusTo(groups[idx], 0, 'p1');
      }

      function focusLastMatch() {
        const groups = getGroupKeys();
        const idx = findNonEmptyGroupIndex(groups, groups.length - 1, -1);
        if (idx >= 0) {
          const matches = getMatchesForGroup(groups[idx]);
          moveFocusTo(groups[idx], matches.length - 1, 'p1');
        }
      }

      // 現在フォーカス中の選手にスコアを設定
      function setScoreForFocusedPlayer(score) {
        if (currentFocus.group == null) return;
        applyScore(
          currentFocus.group,
          currentFocus.index,
          currentFocus.player,
          score,
        );
        focusNextMatch();
      }

      // 現在フォーカス中の選手をリタイアにする
      function retireFocusedPlayer() {
        if (currentFocus.group == null) return;
        applyRetire(currentFocus.group, currentFocus.index, currentFocus.player);
        focusNextMatch();
      }

      // ヘルプパネルの表示/非表示
      function toggleHelp() {
        isHelpVisible = !isHelpVisible;
        renderHelpPanel();
      }

      function renderHelpPanel() {
        let existingOverlay = document.querySelector('.keyboard-help-overlay');
        if (existingOverlay) existingOverlay.remove();

        if (!isHelpVisible) return;

        const overlay = document.createElement('div');
        overlay.className = 'keyboard-help-overlay';

        const panel = document.createElement('div');
        panel.className = 'keyboard-help-panel';

        panel.innerHTML = `
        <h2>キーボードショートカット</h2>

        <div class="keyboard-help-section">
          <h3>スコア入力</h3>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">1 - 6</div>
            <div class="keyboard-help-description">スコアを設定（1→0点、2→1点、3→2点、4→3点、5→4点、6→5点）</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">R</div>
            <div class="keyboard-help-description">選択中の選手をリタイア扱いにする</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">Tab</div>
            <div class="keyboard-help-description">次の選手へ移動</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">Shift + Tab</div>
            <div class="keyboard-help-description">前の選手へ移動</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">Enter</div>
            <div class="keyboard-help-description">次の試合へ移動</div>
          </div>
        </div>

        <div class="keyboard-help-section">
          <h3>ナビゲーション</h3>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">I / M</div>
            <div class="keyboard-help-description">同じグループ内で試合を上下に移動</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">J / K</div>
            <div class="keyboard-help-description">同じ試合内で選手を切り替え</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">PageUp / PageDown</div>
            <div class="keyboard-help-description">グループ間を移動</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">Home</div>
            <div class="keyboard-help-description">最初の試合へジャンプ</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">End</div>
            <div class="keyboard-help-description">最後の試合へジャンプ</div>
          </div>
        </div>

        <div class="keyboard-help-section">
          <h3>その他</h3>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">?</div>
            <div class="keyboard-help-description">このヘルプを表示/非表示</div>
          </div>
          <div class="keyboard-help-item">
            <div class="keyboard-help-key">Esc</div>
            <div class="keyboard-help-description">ヘルプを閉じる</div>
          </div>
        </div>

        <button class="keyboard-help-close">閉じる</button>
      `;

        overlay.appendChild(panel);
        document.body.appendChild(overlay);

        overlay.addEventListener('click', (e) => {
          if (
            e.target === overlay ||
            e.target.classList.contains('keyboard-help-close')
          ) {
            isHelpVisible = false;
            renderHelpPanel();
          }
        });
      }

      // グローバルキーボードイベントリスナー
      document.addEventListener('keydown', (e) => {
        // 入力フィールドにフォーカスがある場合は無視
        const activeElement = document.activeElement;
        const isInputFocused =
          activeElement.tagName === 'INPUT' ||
          activeElement.tagName === 'TEXTAREA' ||
          activeElement.isContentEditable;

        // ヘルプ表示中はEscで閉じる
        if (isHelpVisible && e.key === 'Escape') {
          e.preventDefault();
          isHelpVisible = false;
          renderHelpPanel();
          return;
        }

        // 通常の入力フィールドにフォーカスがある場合は、?とEsc以外は無視
        if (isInputFocused && e.key !== '?' && e.key !== 'Escape') {
          return;
        }

        // ? キーでヘルプ
        if (e.key === '?' || (e.shiftKey && e.key === '/')) {
          e.preventDefault();
          toggleHelp();
          return;
        }

        // ヘルプ表示中はショートカットを無効化
        if (isHelpVisible) return;

        // 数字キー（1-6）でスコア入力（1→0点、2→1点、3→2点、4→3点、5→4点、6→5点）
        if (
          e.key >= '1' &&
          e.key <= '6' &&
          !e.shiftKey &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey
        ) {
          e.preventDefault();
          setScoreForFocusedPlayer(Number(e.key) - 1);
          return;
        }

        // Rキーでリタイア（Cmd/Ctrl+Rはブラウザのリロードを優先）
        if ((e.key === 'r' || e.key === 'R') && !e.metaKey && !e.ctrlKey) {
          e.preventDefault();
          retireFocusedPlayer();
          return;
        }

        // Tabキーで次の選手へ
        if (e.key === 'Tab') {
          e.preventDefault();
          if (e.shiftKey) {
            focusPrevPlayer();
          } else {
            focusNextPlayer();
          }
          return;
        }

        // Enterキーで次の試合へ
        if (e.key === 'Enter') {
          e.preventDefault();
          focusNextMatch();
          return;
        }

        // I/M/J/K キーでナビゲーション
        if (e.key === 'i' || e.key === 'I' || e.key === 'ArrowUp') {
          e.preventDefault();
          focusMatchUp();
          return;
        }

        if (e.key === 'm' || e.key === 'M' || e.key === 'ArrowDown') {
          e.preventDefault();
          focusMatchDown();
          return;
        }

        if (e.key === 'j' || e.key === 'J' || e.key === 'ArrowLeft') {
          e.preventDefault();
          focusPlayerLeft();
          return;
        }

        if (e.key === 'k' || e.key === 'K' || e.key === 'ArrowRight') {
          e.preventDefault();
          focusPlayerRight();
          return;
        }

        // PageUp/PageDownでグループ移動
        if (e.key === 'PageUp') {
          e.preventDefault();
          focusGroupPrev();
          return;
        }

        if (e.key === 'PageDown') {
          e.preventDefault();
          focusGroupNext();
          return;
        }

        // Home/Endで最初/最後の試合へ
        if (e.key === 'Home') {
          e.preventDefault();
          focusFirstMatch();
          return;
        }

        if (e.key === 'End') {
          e.preventDefault();
          focusLastMatch();
          return;
        }

        // Escapeでヘルプを閉じる
        if (e.key === 'Escape') {
          e.preventDefault();
          if (isHelpVisible) {
            isHelpVisible = false;
            renderHelpPanel();
          }
          return;
        }
      });
      // ========================================
      // キーボードショートカット機能ここまで
      // ========================================

      // 1. 最初に matchesDiv に1回だけイベントを仕込む
      let eventRegistered = false;

      function displayMatches() {
        const matchesDiv = document.getElementById('matches');
        matchesDiv.innerHTML = '';

        for (const group in allGroupMatches) {
          const title = document.createElement('h2');
          title.textContent = `グループ ${group}`;
          matchesDiv.appendChild(title);

          allGroupMatches[group].forEach((match, i) => {
            const div = document.createElement('div');
            div.className = 'match-result';
            div.dataset.match = `${group}-${i}`;
            div.innerHTML = renderMatchHtml(match, i);
            matchesDiv.appendChild(div);
          });
        }

        if (!eventRegistered) {
          document
            .getElementById('matches')
            .addEventListener('click', handleScoreClick);
          eventRegistered = true;
        }
      }

      function renderMatchHtml(match, i) {
        i = parseInt(i);
        const matchId = match.group + '-' + i;
        const renderButtons = (playerKey) => {
          return (
            [0, 1, 2, 3, 4, 5]
              .map((score) => {
                const selected =
                  match.scores[playerKey] === score ? 'selected' : '';
                return `<button data-match='${matchId}' data-player='${playerKey}' data-score='${score}' class='score-button ${selected}'>${score}</button>`;
              })
              .join('') +
            `<button class='retire-button' data-match='${matchId}' data-player='${playerKey}'>R</button>`
          );
        };

        const p1Name = getDisplayName(match.p1);
        const p2Name = getDisplayName(match.p2);

        return `
            <strong>試合 ${i + 1}</strong>
            <div class="score-container">
              <div class="player-score-row" data-player="p1">
                <span class="player-name">${p1Name}</span>
                <div class="score-set">${renderButtons('p1')}</div>
              </div>
              <div class="player-score-row" data-player="p2">
                <span class="player-name">${p2Name}</span>
                <div class="score-set">${renderButtons('p2')}</div>
              </div>
            </div>
            <div>勝者: <span id='winner-${matchId}'>${match.winner === match.p1.id ? p1Name : match.winner === match.p2.id ? p2Name : '未定'}</span></div>
            `;
      }

      // マッチカードのDOMを再描画（フォーカス済みのcard自体のクラスは維持される）
      function rerenderMatch(group, idx, match) {
        const matchDiv = document.querySelector(
          `.match-result[data-match="${group}-${idx}"]`,
        );
        if (matchDiv) matchDiv.innerHTML = renderMatchHtml(match, idx);
      }

      function applyScore(group, idx, side, score) {
        const match = allGroupMatches[group] && allGroupMatches[group][idx];
        if (!match) return;
        match.scores[side] = score;
        updateWinner(match);
        rerenderMatch(group, idx, match);
        updateJsonOutput();
      }

      function applyRetire(group, idx, side) {
        const match = allGroupMatches[group] && allGroupMatches[group][idx];
        if (!match) return;
        const opponent = side === 'p1' ? 'p2' : 'p1';
        match[side].retired = true;
        match.scores[side] = 0;
        match.scores[opponent] = initScore;
        match.winner = match[opponent].id;
        rerenderMatch(group, idx, match);
        updateJsonOutput();
      }

      function handleScoreClick(e) {
        const target = e.target;
        if (!target.dataset.match) return;

        const [group, idx] = target.dataset.match.split('-');
        const i = parseInt(idx);

        if (target.classList.contains('score-button')) {
          applyScore(group, i, target.dataset.player, parseInt(target.dataset.score));
        } else if (target.classList.contains('retire-button')) {
          applyRetire(group, i, target.dataset.player);
        }
      }

      function updateJsonOutput(force = false) {
        const output = { roundRobinMatches: [] };
        // 開催前（1試合もスコア未入力）でも entries/participants を出力できるように、
        // グループ分けされた入力から直接メタ情報を載せる。
        output.entriesMeta = buildEntriesMeta();

        for (const group in allGroupMatches) {
          for (const match of allGroupMatches[group]) {
            if (!match.winner) continue;

            const cat1 = detectCategory(match.p1);
            const cat2 = detectCategory(match.p2);
            const category = cat1 === cat2 ? cat1 : cat1; // 混在はまずない想定。あれば p1 優先。

            const p1Score = String(match.scores.p1);
            const p2Score = String(match.scores.p2);

            if (category === 'team') {
              // ---- team カテゴリの出力 ----
              const p1Key =
                match.p1.tempId || match.p1.team || String(match.p1.id);
              const p2Key =
                match.p2.tempId || match.p2.team || String(match.p2.id);

              // p1 視点
              output.roundRobinMatches.push({
                group,
                team: p1Key, // 識別キー（tempId/チーム名/IDの順）
                opponentTeam: {
                  team: match.p2.team || p2Key,
                  prefecture: match.p2.prefecture || '',
                },
                result: match.winner === match.p1.id ? 'win' : 'lose',
                games: { won: p1Score, lost: p2Score },
                entryNo: match.p1.id,
                name: getDisplayName(match.p1),
                category: 'team',
                retired: match.p1.retired || false,
              });

              // p2 視点
              output.roundRobinMatches.push({
                group,
                team: p2Key,
                opponentTeam: {
                  team: match.p1.team || p1Key,
                  prefecture: match.p1.prefecture || '',
                },
                result: match.winner === match.p2.id ? 'win' : 'lose',
                games: { won: p2Score, lost: p1Score },
                entryNo: match.p2.id,
                name: getDisplayName(match.p2),
                category: 'team',
                retired: match.p2.retired || false,
              });
            } else {
              // ---- doubles（従来） ----
              const p1Ids = (match.p1.information || []).map(
                (info) => info.playerId || info.tempId,
              );
              const p2Ids = (match.p2.information || []).map(
                (info) => info.playerId || info.tempId,
              );
              const p1IsValid =
                p1Ids.length > 0 && p1Ids.every((id) => id != null);
              const p2IsValid =
                p2Ids.length > 0 && p2Ids.every((id) => id != null);

              if (p1IsValid) {
                output.roundRobinMatches.push({
                  group,
                  pair: p1Ids,
                  opponents: match.p2.information || [],
                  result: match.winner === match.p1.id ? 'win' : 'lose',
                  games: { won: p1Score, lost: p2Score },
                  entryNo: match.p1.id,
                  name: getDisplayName(match.p1),
                  category: 'doubles',
                  retired: match.p1.retired || false,
                });
              }

              if (p2IsValid) {
                output.roundRobinMatches.push({
                  group,
                  pair: p2Ids,
                  opponents: match.p1.information || [],
                  result: match.winner === match.p2.id ? 'win' : 'lose',
                  games: { won: p2Score, lost: p1Score },
                  entryNo: match.p2.id,
                  name: getDisplayName(match.p2),
                  category: 'doubles',
                  retired: match.p2.retired || false,
                });
              }
            }
          }
        }

        // ---- standings はそのままでOK（nameとidがあれば動く）----
        // ---- standings 修正版 ----
        output.standings = {};

        for (const group in playersByGroup) {
          const players = playersByGroup[group].filter((p) => p.id !== 'bye');
          const playerStats = {};

          // 初期化
          for (const p of players) {
            playerStats[p.id] = {
              id: p.id,
              name: p.name,
              wins: 0,
              losses: 0,
              scoreDiff: 0,
              totalPointsFor: 0,
              totalPointsAgainst: 0,
            };
          }

          // 全試合集計
          for (const match of allGroupMatches[group]) {
            const { p1, p2, scores, winner } = match;
            if (!winner || p1.id === 'bye' || p2.id === 'bye') continue;
            const s1 = scores.p1,
              s2 = scores.p2;

            playerStats[p1.id].scoreDiff += s1 - s2;
            playerStats[p2.id].scoreDiff += s2 - s1;
            playerStats[p1.id].totalPointsFor += s1;
            playerStats[p1.id].totalPointsAgainst += s2;
            playerStats[p2.id].totalPointsFor += s2;
            playerStats[p2.id].totalPointsAgainst += s1;

            if (winner === p1.id) {
              playerStats[p1.id].wins++;
              playerStats[p2.id].losses++;
            } else {
              playerStats[p2.id].wins++;
              playerStats[p1.id].losses++;
            }
          }

          // 同率時に使う「当該者間」比較関数
          function compareHeadToHead(ids) {
            const subStats = {};
            ids.forEach((id) => {
              subStats[id] = { id, wins: 0, diff: 0 };
            });

            // 当該者間だけ再集計
            for (const match of allGroupMatches[group]) {
              const { p1, p2, scores, winner } = match;
              if (!winner) continue;
              if (!ids.includes(p1.id) || !ids.includes(p2.id)) continue;

              const s1 = scores.p1,
                s2 = scores.p2;
              subStats[p1.id].diff += s1 - s2;
              subStats[p2.id].diff += s2 - s1;

              if (winner === p1.id) subStats[p1.id].wins++;
              else subStats[p2.id].wins++;
            }

            return subStats;
          }

          // ソート
          let sorted = Object.values(playerStats);

          sorted.sort((a, b) => {
            // まず勝数
            if (b.wins !== a.wins) return b.wins - a.wins;

            // 同率チーム群の当該者間比較
            const tied = sorted.filter((s) => s.wins === a.wins);
            if (tied.length > 1) {
              const headToHead = compareHeadToHead(tied.map((s) => s.id));
              const diffA = headToHead[a.id]?.wins ?? 0;
              const diffB = headToHead[b.id]?.wins ?? 0;
              if (diffB !== diffA) return diffB - diffA;

              // 当該者間の得失差
              const subA = headToHead[a.id]?.diff ?? 0;
              const subB = headToHead[b.id]?.diff ?? 0;
              if (subB !== subA) return subB - subA;
            }

            // まだ同じなら全試合の得失差
            if (b.scoreDiff !== a.scoreDiff) return b.scoreDiff - a.scoreDiff;

            // 同点なら総得点で
            if (b.totalPointsFor !== a.totalPointsFor)
              return b.totalPointsFor - a.totalPointsFor;

            return 0; // 完全同点（抽選扱い）
          });

          // 順位付け
          sorted.forEach((s, i) => (s.rank = i + 1));
          output.standings[group] = sorted;
        }

        lastRawOutput = output;

        // 手動編集済みのときは上書きしない（force時のみ再生成）
        if (jsonManuallyEdited && !force) {
          return;
        }

        try {
          document.getElementById('jsonOutput').value =
            ToolBridge.normalize(output);
          // 保存前に入力ミス（相方の重複・未登録の対戦相手など）を表示する。
          ToolBridge.renderValidation(
            document.getElementById('validationResult'),
          );
        } catch (e) {
          document.getElementById('jsonOutput').value =
            '成形エラー: ' + (e && e.message ? e.message : e);
        }
      }

      // ---- 成形済み出力の保存UI ----
      let lastRawOutput = null;
      ToolBridge.buildSaveUI(document.getElementById('saveUi'), () =>
        document.getElementById('jsonOutput').value.startsWith('成形エラー')
          ? ''
          : document.getElementById('jsonOutput').value,
      );

      // ---- トーナメント進出 ----
      function onClickExtractAdvancers() {
        const statusEl = document.getElementById('advanceStatus');
        statusEl.textContent = '';
        updateJsonOutput();
        if (!lastRawOutput || !lastRawOutput.standings) {
          statusEl.textContent = '順位が確定していません';
          return;
        }
        const n =
          parseInt(document.getElementById('advanceRank').value, 10) || 1;
        const advancers = [];
        // rank優先（各グループ1位→各グループ2位…の順）
        for (let rank = 1; rank <= n; rank++) {
          for (const group in lastRawOutput.standings) {
            const standing = lastRawOutput.standings[group].find(
              (s) => s.rank === rank,
            );
            if (!standing) continue;
            const player = (playersByGroup[group] || []).find(
              (p) => String(p.id) === String(standing.id),
            );
            if (player) advancers.push(player);
          }
        }
        document.getElementById('advancersJson').value = JSON.stringify(
          advancers,
          null,
          2,
        );
        statusEl.style.color = '#2e7d32';
        statusEl.textContent = `${advancers.length}件を抽出しました`;
      }

      // 成形済み（正規化）JSON から roundRobinMatches を復元する。
      // jsonOutput を手動編集した場合、編集内容は allGroupMatches（UI状態）に
      // 反映されないため、持ち越し用のRR結果は編集後JSONから組み立てる。
      // これによりRRで敗退した（本戦に進出しない）選手の情報も欠落しない。
      function rrMatchesFromNormalized(norm) {
        if (!norm || !Array.isArray(norm.matches)) return [];
        const partById = new Map(
          (norm.participants || []).map((p) => [p.id, p]),
        );
        const entryById = new Map(
          (norm.entries || []).map((e) => [e.entryNo, e]),
        );
        const infoFor = (entry) =>
          (entry && Array.isArray(entry.playerIds) ? entry.playerIds : []).map(
            (id) => {
              const p = partById.get(id);
              return p
                ? {
                    lastName: p.lastName,
                    firstName: p.firstName,
                    team: p.team,
                    prefecture: p.prefecture,
                    tempId: id,
                    playerId: null,
                  }
                : { tempId: id, playerId: null };
            },
          );
        const rows = [];
        for (const m of norm.matches) {
          if (m.stage !== 'roundrobin') continue;
          const a = m.entries && m.entries[0];
          const b = m.entries && m.entries[1];
          if (a == null || b == null) continue;
          const ea = entryById.get(a);
          const eb = entryById.get(b);
          const sa = m.scores ? m.scores[String(a)] : undefined;
          const sb = m.scores ? m.scores[String(b)] : undefined;
          if (sa == null || sb == null) continue;
          const winA = m.winnerEntryNo === a;
          rows.push({
            group: m.group,
            pair: (ea && ea.playerIds) || [],
            opponents: infoFor(eb),
            result: winA ? 'win' : 'lose',
            games: { won: String(sa), lost: String(sb) },
            entryNo: a,
            category: 'doubles',
          });
          rows.push({
            group: m.group,
            pair: (eb && eb.playerIds) || [],
            opponents: infoFor(ea),
            result: winA ? 'lose' : 'win',
            games: { won: String(sb), lost: String(sa) },
            entryNo: b,
            category: 'doubles',
          });
        }
        return rows;
      }

      function onClickGoTournament() {
        const statusEl = document.getElementById('advanceStatus');
        statusEl.style.color = '#c62828';
        statusEl.textContent = '';
        let advancers;
        try {
          advancers = JSON.parse(
            document.getElementById('advancersJson').value,
          );
        } catch (e) {
          statusEl.textContent = '進出ペアのJSONパースエラー: ' + e.message;
          return;
        }
        if (!Array.isArray(advancers) || !advancers.length) {
          statusEl.textContent = '進出ペアを先に抽出してください';
          return;
        }
        updateJsonOutput();
        if (!lastRawOutput) {
          statusEl.textContent = 'ラウンドロビン結果がありません';
          return;
        }

        // 持ち越すRR結果：手動編集済みなら編集後JSONから復元し、
        // 未編集ならUI状態（lastRawOutput）をそのまま使う。
        let rrMatchesForCarry = lastRawOutput.roundRobinMatches;
        if (jsonManuallyEdited) {
          let edited;
          try {
            edited = JSON.parse(document.getElementById('jsonOutput').value);
          } catch (e) {
            statusEl.textContent =
              '編集済みJSONのパースに失敗しました: ' + e.message;
            return;
          }
          rrMatchesForCarry = rrMatchesFromNormalized(edited);
          if (!rrMatchesForCarry.length) {
            statusEl.textContent =
              '編集済みJSONからラウンドロビン結果を取得できませんでした';
            return;
          }
        }

        // RR結果を持ち越してトーナメント出力にマージする
        // （standings は normalize 側で roundRobinMatches から再計算されるため参考値）
        ToolBridge.setRRCarry({
          roundRobinMatches: rrMatchesForCarry,
          standings: lastRawOutput.standings,
        });
        ToolBridge.storeInput('tournament', advancers);
        location.href = '../tournament3/index.html';
      }

      // 手動編集の検知：ユーザーがJSONを編集したら自動上書きを止める
      document.getElementById('jsonOutput').addEventListener('input', () => {
        jsonManuallyEdited = true;
        setJsonEditStatus();
      });

      displayMatches();
      initFocus();
      applyFocusVisuals();
      // 開催前（スコア未入力）でも entries/participants JSON を即座に見せる。
      updateJsonOutput();
    </script>
  </body>
</html>
